<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>IoT Dashboard</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;background:#f7f6f2;color:#1d1d1b}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
  .card{background:#fff;border:1px solid #cfcabd;border-radius:10px;padding:16px}
  .card h3{margin:0 0 8px;font-size:14px;color:#4a4943}
  .big{font-size:28px;font-weight:600}
  button{font-size:16px;padding:8px 16px;border-radius:8px;border:1px solid #1d1d1b;background:#fff;cursor:pointer;margin-right:8px}
  input{font-size:14px;padding:6px;width:260px}
  canvas{width:100%;height:120px;background:#fff;border:1px solid #cfcabd;border-radius:10px}
  ul{padding-left:18px;margin:8px 0}
  #conn{font-size:14px}
</style>
</head>
<body>
<h1>IoT Dashboard</h1>
<div>Pi API: <input id="api" placeholder="http://IP-ของ-Pi:8001"> <span id="conn">—</span></div>

<div class="row">
  <div class="card"><h3>IR sensor</h3><div class="big" id="ir">—</div></div>
  <div class="card"><h3>LED</h3><div class="big" id="led">—</div></div>
  <div class="card"><h3>แสง (LoRa node)</h3><div class="big" id="light">—</div></div>
</div>

<div class="card">
  <h3>ควบคุม LED</h3>
  <button onclick="setLed('ON')">เปิด</button>
  <button onclick="setLed('OFF')">ปิด</button>
</div>

<div class="card" style="margin-top:12px">
  <h3>ค่าแสงย้อนหลัง</h3>
  <canvas id="chart" width="700" height="120"></canvas>
</div>

<div class="card" style="margin-top:12px">
  <h3>ประวัติ IR</h3>
  <ul id="events"></ul>
</div>

<script>
const $ = id => document.getElementById(id);
let base = localStorage.getItem("piApi") || "http://PI_IP:8001";
$("api").value = base;
$("api").onchange = e => {
  base = e.target.value.trim().replace(/\/$/, "");
  localStorage.setItem("piApi", base);
  refresh();
};
const lightHist = [];
let lastLt = null;

function drawChart() {
  const c = $("chart"), g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  if (lightHist.length < 2) return;
  g.strokeStyle = "#1d4ed8"; g.lineWidth = 2; g.beginPath();
  lightHist.forEach((v, i) => {
    const x = i / (lightHist.length - 1) * (c.width - 10) + 5;
    const y = c.height - 5 - v / 100 * (c.height - 10);
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  });
  g.stroke();
}

async function refresh() {
  try {
    const s = await (await fetch(base + "/api/status")).json();
    $("conn").textContent = "เชื่อมต่อ Pi แล้ว";
    $("led").textContent = s.led ?? "—";
    $("ir").textContent = s.ir === "DETECTED" ? "เจอวัตถุ" : s.ir === "CLEAR" ? "ไม่มีวัตถุ" : "—";
    $("light").textContent = s.light == null ? "—" : s.light + " %";
    const lt = s.updated && s.updated.light;
    if (s.light != null && lt !== lastLt) { lastLt = lt; lightHist.push(s.light); if (lightHist.length > 60) lightHist.shift(); }
    drawChart();
    const ul = $("events"); ul.replaceChildren();
    s.events.slice(0, 10).forEach(e => {
      const li = document.createElement("li");
      li.textContent = new Date(e.t * 1000).toLocaleTimeString("th-TH") + " · " + e.ir;
      ul.appendChild(li);
    });
  } catch (err) {
    $("conn").textContent = "เชื่อมต่อ Pi ไม่ได้";
  }
}

async function setLed(state) {
  await fetch(base + "/api/led", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({state})
  });
  setTimeout(refresh, 500);
}

setInterval(refresh, 1000);
refresh();
</script>
</body>
</html>
